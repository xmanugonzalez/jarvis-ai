name: Compilar IPA de JARVIS AI

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Preparar el fonetizador y el detector local
        run: bash .github/scripts/prepare_kokoro.sh

      - name: Probar la lógica de conversación
        run: |
          set -euo pipefail
          swiftc JarvisAI/Models/AssistantState.swift JarvisAI/Utilities/LocalResponses.swift \
            .github/scripts/test_hands_free.swift -o "$RUNNER_TEMP/jarvis-hands-free-tests"
          "$RUNNER_TEMP/jarvis-hands-free-tests"

      - name: Compilar para iPhone (arm64)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project JarvisAI.xcodeproj \
            -scheme JarvisAI \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/jarvis-build" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Empaquetar y comprobar el IPA
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/jarvis-build/Build/Products/Release-iphoneos/JarvisAI.app"
          python3 .github/scripts/alt_source.py stamp "$app/Info.plist" "$GITHUB_RUN_NUMBER"
          plutil -lint "$app/Info.plist"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          xcrun lipo "$app/$executable" -verify_arch arm64
          test -f "$app/KokoroSupport/espeak-ng-data/es_dict"
          test -s "$app/KokoroSupport/WakeWord/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx"
          test -s "$app/KokoroSupport/WakeWord/jarvis.txt"
          test ! -e "$app/KokoroSupport/model.int8.onnx"
          test ! -e "$app/embedded.mobileprovision"
          output="$GITHUB_WORKSPACE/dist"
          stage="$(mktemp -d "$RUNNER_TEMP/jarvis-ipa.XXXXXX")"
          mkdir -p "$output" "$stage/Payload"
          ditto "$app" "$stage/Payload/JarvisAI.app"
          cd "$stage"
          /usr/bin/zip -q -r "$output/JARVIS-AI.ipa" Payload
          /usr/bin/unzip -tq "$output/JARVIS-AI.ipa"
          /usr/bin/unzip -Z1 "$output/JARVIS-AI.ipa" "Payload/JarvisAI.app/$executable"

      - name: Publicar artefacto
        uses: actions/upload-artifact@v6
        with:
          name: JARVIS-AI-iOS
          path: dist/JARVIS-AI.ipa
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  release:
    needs: ipa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: jarvis-ios-releases
      queue: max
    steps:
      - uses: actions/checkout@v6

      - name: Recuperar el IPA verificado
        uses: actions/download-artifact@v6
        with:
          name: JARVIS-AI-iOS
          path: dist

      - name: Publicar el IPA en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep one release per build, including retries of a failed publish.
          tag="ios-${GITHUB_RUN_NUMBER}.1-${GITHUB_RUN_ID}"
          latest_tag="$(gh api graphql \
            -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { latestRelease { tagName } } }' \
            -f owner="${GITHUB_REPOSITORY%%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.latestRelease.tagName // ""')"

          # Una ejecución antigua que termine tarde conserva su Release sin desplazar a Latest.
          latest=true
          if [[ "$latest_tag" =~ ^ios-([0-9]+)\.[0-9]+-[0-9]+$ ]] &&
            (( BASH_REMATCH[1] > GITHUB_RUN_NUMBER )); then
            latest=false
          fi

          if draft="$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$draft" == true ]]; then
              gh release upload "$tag" dist/JARVIS-AI.ipa --clobber
              gh release edit "$tag" --draft=false --latest="$latest"
            fi
          else
            gh release create "$tag" dist/JARVIS-AI.ipa \
              --target "$GITHUB_SHA" \
              --title "JARVIS AI · $tag" \
              --notes "IPA para iPhone (arm64) sin firma, listo para firmar e instalar con SideStore." \
              --latest="$latest"
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/jarvis-release.json"
          gh release download "$tag" --pattern JARVIS-AI.ipa --dir "$RUNNER_TEMP"

      - name: Actualizar la fuente de SideStore
        run: |
          set -euo pipefail
          publisher="$RUNNER_TEMP/jarvis-alt-source.py"
          cp .github/scripts/alt_source.py "$publisher"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach FETCH_HEAD
            python3 "$publisher" update source.json "$RUNNER_TEMP/JARVIS-AI.ipa" \
              "$RUNNER_TEMP/jarvis-release.json" "$GITHUB_REPOSITORY"
            if git diff --quiet -- source.json; then
              exit 0
            fi
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --only source.json -m "chore: actualizar fuente de SideStore"
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
          done
          exit 1
